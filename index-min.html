<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TTI Cable Benchmark — Minimal</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg-0:#000810; --bg-1:#0a141d; --bg-2:#132026; --bg-3:#1d2d35;
    --border:#1d2f3a; --text:#dbe7ed; --text-dim:#94a3b8; --text-mute:#64748b;
    --accent:#00c8e6; --tti:#00c8e6; --comp:#f59e0b; --hyp:#3b82f6;
    --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono','SF Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-0);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.5;overflow:hidden;height:100vh}
  #app{display:grid;grid-template-columns:280px 1fr 360px;grid-template-rows:48px 1fr;height:100vh}
  header{grid-column:1/-1;background:var(--bg-1);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:20px}
  header h1{font-size:14px;font-weight:600;color:var(--text)}
  header .sub{font-size:11px;color:var(--text-mute);font-family:var(--mono)}
  header .spacer{flex:1}
  header .counts{font-size:11px;color:var(--text-mute);font-family:var(--mono)}

  aside.left{background:var(--bg-1);border-right:1px solid var(--border);overflow-y:auto;padding:14px}
  aside.right{background:var(--bg-1);border-left:1px solid var(--border);overflow-y:auto;padding:14px}
  main{position:relative;background:var(--bg-0)}
  #map{position:absolute;inset:0}

  h3{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin:14px 0 8px;font-weight:600;font-family:var(--mono)}
  h3:first-child{margin-top:0}
  input,select{width:100%;background:var(--bg-2);border:1px solid var(--border);border-radius:4px;padding:7px 9px;color:var(--text);font-size:12px;font-family:var(--sans)}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .pin-count{font-size:11px;color:var(--accent);font-family:var(--mono);font-weight:600}

  .cable-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;cursor:pointer;margin:1px 0}
  .cable-row:hover{background:var(--bg-2)}
  .cable-row.pinned{background:rgba(0,200,230,0.08)}
  .cable-row input[type=checkbox]{width:14px;height:14px;flex:none;cursor:pointer;accent-color:var(--accent);margin:0}
  .cable-row .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .cable-row .name{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cable-row .group{font-family:var(--mono);font-size:9px;color:var(--text-mute);text-transform:uppercase;letter-spacing:0.4px;flex:none}

  /* Right panel */
  .empty-state{padding:40px 20px;text-align:center;color:var(--text-mute)}
  .empty-state .icon{font-size:36px;opacity:0.3;margin-bottom:12px}
  .empty-state .title{font-size:13px;color:var(--text);margin-bottom:6px}
  .empty-state .hint{font-size:11px;line-height:1.6}

  .detail h2{font-size:16px;font-weight:600;margin-bottom:4px}
  .detail .tag{display:inline-block;background:var(--bg-2);border:1px solid var(--border);border-radius:3px;padding:2px 7px;font-size:9px;text-transform:uppercase;letter-spacing:0.6px;font-family:var(--mono);color:var(--text-dim);margin-right:4px}
  .detail .owner{font-size:11px;color:var(--text-dim);margin:6px 0 14px}
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
  .kpi{background:var(--bg-2);border:1px solid var(--border);border-radius:4px;padding:8px 10px}
  .kpi .k{font-size:9px;color:var(--text-mute);text-transform:uppercase;letter-spacing:0.5px;font-family:var(--mono)}
  .kpi .v{font-size:14px;font-weight:600;margin-top:2px;color:var(--text)}
  .kpi .u{font-size:10px;color:var(--text-mute);margin-left:3px;font-weight:400}
  .meta-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted var(--border);font-size:11px}
  .meta-row .k{color:var(--text-mute)}
  .meta-row .v{color:var(--text);text-align:right;max-width:65%}
  .notes{margin-top:12px;padding:10px;background:var(--bg-2);border-left:2px solid var(--accent);border-radius:0 4px 4px 0;font-size:11px;color:var(--text-dim);line-height:1.6}
  .est{display:inline-block;background:rgba(245,158,11,0.15);color:#f59e0b;padding:1px 4px;border-radius:2px;font-size:8px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.5px;margin-left:3px;vertical-align:middle}

  /* Benchmark table */
  .bench h2{font-size:14px;font-weight:600;margin-bottom:2px}
  .bench .meta{font-size:10px;color:var(--text-mute);margin-bottom:12px}
  .bench table{width:100%;border-collapse:collapse;font-size:11px}
  .bench th,.bench td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
  .bench th{font-size:9px;text-transform:uppercase;color:var(--text-dim);font-family:var(--mono);font-weight:600;letter-spacing:0.5px;background:var(--bg-2)}
  .bench th .name{font-weight:600;color:var(--text);font-size:11px;text-transform:none;letter-spacing:normal;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bench th .grp{font-family:var(--mono);font-size:8px;color:var(--text-mute);margin-top:1px}
  .bench td.metric{color:var(--text-mute);font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap}
  .bench td.best{background:rgba(0,200,230,0.12);color:var(--accent);font-weight:600}
  .bench .actions{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
  .btn{background:var(--bg-2);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:4px;font-size:11px;cursor:pointer;font-family:var(--sans)}
  .btn:hover{background:var(--bg-3);border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--bg-0);border-color:var(--accent);font-weight:600}
  .btn.danger{color:#ef4444;border-color:#7f1d1d}

  /* Leaflet popup customization */
  .leaflet-popup-content-wrapper{background:var(--bg-1);color:var(--text);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
  .leaflet-popup-tip{background:var(--bg-1);border:1px solid var(--border)}
  .leaflet-popup-content{margin:10px 12px;font-family:var(--sans);font-size:11px;line-height:1.5}
  .leaflet-popup-content .pt{font-size:12px;font-weight:600;color:var(--text);margin-bottom:3px}
  .leaflet-popup-content .pm{color:var(--text-mute);font-size:10px}
  .leaflet-control-zoom a{background:var(--bg-1);color:var(--text);border:1px solid var(--border)}
  .leaflet-control-zoom a:hover{background:var(--bg-2)}
  .leaflet-control-attribution{background:rgba(10,20,29,0.85);color:var(--text-mute);font-size:9px}
  .leaflet-control-attribution a{color:var(--text-dim)}

  /* Status / load */
  .status{position:absolute;left:10px;bottom:10px;background:rgba(10,20,29,0.85);border:1px solid var(--border);border-radius:4px;padding:6px 10px;font-size:10px;font-family:var(--mono);color:var(--text-mute);z-index:1000}
  .status.ok{color:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>TTI Cable Benchmark</h1>
    <span class="sub" id="hdr-sub">loading…</span>
    <div class="spacer"></div>
    <span class="counts" id="hdr-counts"></span>
  </header>

  <aside class="left">
    <h3>Filter <span class="pin-count" id="pin-count">0/3</span></h3>
    <input type="text" id="search" placeholder="Search name, operator…" />
    <select id="filter-group">
      <option value="">All operators</option>
      <option value="tti">TTI</option>
      <option value="competitor">Competitor</option>
      <option value="hyperscaler">Hyperscaler</option>
      <option value="subsea">Other subsea</option>
    </select>
    <h3>Cables <span class="pin-count" id="cable-count">—</span></h3>
    <div id="cable-list"></div>
  </aside>

  <main>
    <div id="map"></div>
    <div class="status" id="status">initializing…</div>
  </main>

  <aside class="right" id="right-panel">
    <div class="empty-state">
      <div class="icon">⊟</div>
      <div class="title">Soldan kablo seçin</div>
      <div class="hint">Karşılaştırmak için max 3 kablo tikleyin.<br/>Harita otomatik zoom yapar, burada benchmark tablosu çıkar.</div>
    </div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js?v=10"></script>
<script src="app-min.js?v=10"></script>
</body>
</html>
