<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TTI Cable & Infrastructure Benchmark · v2</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg-0:#07090d; --bg-1:#0d1218; --bg-2:#141b24; --bg-3:#1c2531;
      --border:#233042; --text:#e6edf3; --text-dim:#9aa4b2; --text-mute:#5f6b7a;
      --accent:#00c8e6; --accent-strong:#00a8c2; --tti-blue:#0066b3;
      --warn:#f5b400; --danger:#f85149; --ok:#3fb950;
      --c-tti:#00c8e6; --c-tti-pop:#22d3ee;
      --c-competitor:#f59e0b; --c-competitor-noc:#fb7185;
      --c-hs-subsea:#3b82f6;
      --c-aws:#ff9900; --c-azure:#0078d4; --c-gcp:#4285f4; --c-meta:#1877f2;
      --c-ai:#ec4899; --c-landing:#a78bfa; --c-carrier:#c084fc; --c-ixp:#84cc16;
      --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
      --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%;overflow:hidden}
    body{background:var(--bg-0);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
    #app{display:grid;grid-template-rows:48px 1fr;height:100vh}

    /* TOP BAR */
    #topbar{display:flex;align-items:center;padding:0 16px;background:var(--bg-1);border-bottom:1px solid var(--border);gap:24px}
    #topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:0.5px}
    #topbar .brand .logo{width:28px;height:28px;background:linear-gradient(135deg,var(--accent),var(--tti-blue));border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#001018}
    #topbar h1{font-size:14px;font-weight:500;margin:0;color:var(--text-dim)}
    #topbar h1 strong{color:var(--text);font-weight:600}
    #topbar .meta{font-family:var(--mono);font-size:10px;color:var(--text-mute)}
    .spacer{flex:1}

    .view-switch{display:flex;gap:2px;background:var(--bg-2);border:1px solid var(--border);border-radius:6px;padding:2px}
    .view-switch button{background:transparent;color:var(--text-dim);border:0;padding:5px 12px;font-size:12px;font-family:var(--sans);cursor:pointer;border-radius:4px}
    .view-switch button:hover{color:var(--text)}
    .view-switch button.active{background:var(--accent);color:#001018;font-weight:600}

    /* LAYOUT */
    main{display:grid;grid-template-columns:320px 1fr 380px;height:calc(100vh - 48px);overflow:hidden}
    #sidebar-left,#sidebar-right{background:var(--bg-1);overflow-y:auto;overflow-x:hidden}
    #sidebar-left{border-right:1px solid var(--border)}
    #sidebar-right{border-left:1px solid var(--border)}
    #content{position:relative;background:var(--bg-0);overflow:hidden}

    /* SIDEBAR */
    .panel-section{padding:14px 16px;border-bottom:1px solid var(--border)}
    .panel-section h3{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-mute);margin:0 0 10px 0;font-weight:600;display:flex;justify-content:space-between;align-items:center}
    .panel-section h3 .mini-btn{background:transparent;border:1px solid var(--border);color:var(--text-mute);font-size:9px;padding:2px 6px;border-radius:3px;cursor:pointer;text-transform:none;letter-spacing:0;font-family:var(--mono)}
    .panel-section h3 .mini-btn:hover{color:var(--text);border-color:var(--accent)}

    .layer-toggle{display:flex;align-items:center;gap:10px;padding:5px 8px;margin:1px -8px;border-radius:4px;cursor:pointer;user-select:none}
    .layer-toggle:hover{background:var(--bg-2)}
    .layer-toggle input[type="checkbox"]{appearance:none;width:14px;height:14px;border:1px solid var(--border);border-radius:3px;background:var(--bg-2);cursor:pointer;position:relative;flex-shrink:0}
    .layer-toggle input[type="checkbox"]:checked{background:var(--accent);border-color:var(--accent)}
    .layer-toggle input[type="checkbox"]:checked::after{content:"";position:absolute;left:3px;top:0;width:4px;height:8px;border:solid #001018;border-width:0 2px 2px 0;transform:rotate(45deg)}
    .layer-toggle .swatch{width:12px;height:3px;border-radius:2px;flex-shrink:0}
    .layer-toggle .swatch.dot{width:8px;height:8px;border-radius:50%}
    .layer-toggle .label{flex:1;font-size:12px}
    .layer-toggle .count{font-family:var(--mono);font-size:10px;color:var(--text-mute)}

    .filters input[type="text"],.filters select{width:100%;background:var(--bg-2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-size:12px;font-family:var(--sans);margin-bottom:8px}
    .filters input[type="text"]:focus,.filters select:focus{outline:none;border-color:var(--accent)}

    .asset-list{padding:4px 8px 12px}
    .asset-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:4px;cursor:pointer;margin:1px 0}
    .asset-item:hover{background:var(--bg-2)}
    .asset-item.selected{background:var(--bg-3)}
    .asset-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .asset-item .name{flex:1;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .asset-item .type{font-family:var(--mono);font-size:9px;color:var(--text-mute);text-transform:uppercase;letter-spacing:0.5px}

    /* RIGHT PANEL */
    .placeholder{padding:40px 20px;text-align:center;color:var(--text-mute);font-size:12px}
    .asset-detail{padding:16px}
    .asset-detail h2{font-size:16px;margin:0 0 4px 0;color:var(--text)}
    .asset-detail .subtitle{font-size:11px;color:var(--text-dim);margin-bottom:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .badge{display:inline-block;padding:2px 7px;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;border-radius:3px;background:var(--bg-3);color:var(--text-dim);font-family:var(--mono)}
    .badge.tti{background:rgba(0,200,230,0.15);color:var(--accent)}
    .badge.est{background:rgba(245,180,0,0.15);color:var(--warn)}
    .badge.ok{background:rgba(63,185,80,0.15);color:var(--ok)}
    .badge.danger{background:rgba(248,81,73,0.15);color:var(--danger)}

    .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
    .kpi{background:var(--bg-2);border:1px solid var(--border);border-radius:4px;padding:8px 10px}
    .kpi .k{font-size:9px;text-transform:uppercase;letter-spacing:0.7px;color:var(--text-mute);margin-bottom:3px}
    .kpi .v{font-family:var(--mono);font-size:14px;color:var(--text);font-weight:500}
    .kpi .u{font-size:10px;color:var(--text-dim);margin-left:3px;font-family:var(--mono)}

    .detail-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;gap:8px}
    .detail-row .k{color:var(--text-dim);flex-shrink:0}
    .detail-row .v{color:var(--text);font-family:var(--mono);text-align:right;word-break:break-word}

    .pin-btn,.action-btn{background:var(--bg-3);color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:4px;cursor:pointer;font-size:11px;font-family:var(--sans)}
    .pin-btn:hover,.action-btn:hover{background:var(--accent);color:#001018;border-color:var(--accent)}
    .pin-btn.active{background:var(--accent);color:#001018;border-color:var(--accent)}

    .comparison-pins{padding:12px 16px;border-top:1px solid var(--border);background:var(--bg-2)}
    .comparison-pins .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .comparison-pins .head h4{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-mute)}
    .pin-slots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
    .pin-slot{background:var(--bg-1);border:1px dashed var(--border);border-radius:4px;padding:8px 6px;min-height:56px;font-size:10px;text-align:center;color:var(--text-mute);cursor:pointer;position:relative}
    .pin-slot.filled{border:1px solid var(--accent);background:var(--bg-2);color:var(--text);text-align:left}
    .pin-slot.filled .x{position:absolute;top:2px;right:4px;color:var(--text-mute);font-size:12px;cursor:pointer}
    .pin-slot.filled .x:hover{color:var(--danger)}
    .pin-slot .pin-name{font-weight:600;font-size:11px;margin-bottom:2px}
    .pin-slot .pin-owner{font-family:var(--mono);font-size:9px;color:var(--text-dim)}

    /* MAP */
    #map{width:100%;height:100%;background:#060a0f}
    .leaflet-container{background:#060a0f;font-family:var(--sans)}
    .leaflet-control-attribution{background:rgba(13,18,24,0.8)!important;color:var(--text-mute)!important;font-size:10px!important}
    .leaflet-control-attribution a{color:var(--text-dim)!important}
    .leaflet-control-zoom a{background:var(--bg-2)!important;color:var(--text)!important;border-color:var(--border)!important}
    .leaflet-control-zoom a:hover{background:var(--bg-3)!important}
    .map-popup{font-family:var(--sans);font-size:12px;color:var(--text)}
    .map-popup .pop-title{font-weight:600;margin-bottom:4px}
    .map-popup .pop-meta{font-family:var(--mono);font-size:10px;color:var(--text-dim)}
    .leaflet-popup-content-wrapper{background:var(--bg-2)!important;color:var(--text)!important;border:1px solid var(--border);border-radius:4px}
    .leaflet-popup-tip{background:var(--bg-2)!important}

    .legend-overlay{position:absolute;bottom:16px;left:16px;background:rgba(13,18,24,0.92);border:1px solid var(--border);border-radius:6px;padding:10px 12px;z-index:500;font-size:11px;min-width:220px;max-height:calc(100vh - 120px);overflow-y:auto}
    .legend-overlay h4{margin:0 0 6px 0;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-mute)}
    .legend-row{display:flex;align-items:center;gap:8px;padding:2px 0;color:var(--text-dim)}
    .legend-row .swatch{width:16px;height:3px;border-radius:2px;flex-shrink:0}
    .legend-row .swatch.dot{width:8px;height:8px;border-radius:50%}

    .stats-overlay{position:absolute;top:16px;right:16px;background:rgba(13,18,24,0.92);border:1px solid var(--border);border-radius:6px;padding:10px 12px;z-index:500;font-size:11px;min-width:200px}
    .stats-overlay h4{margin:0 0 6px 0;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-mute)}
    .stat-row{display:flex;justify-content:space-between;padding:2px 0;font-family:var(--mono);font-size:11px}
    .stat-row .k{color:var(--text-dim)}
    .stat-row .v{color:var(--text)}

    /* TABLE / MATRIX */
    #table-view,#matrix-view{position:absolute;inset:0;overflow:auto;padding:24px;display:none}
    table.benchmark{width:100%;border-collapse:collapse;font-size:12px}
    table.benchmark th{text-align:left;padding:8px 10px;background:var(--bg-2);border-bottom:1px solid var(--border);color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:0.6px;font-weight:600;position:sticky;top:0;cursor:pointer;user-select:none}
    table.benchmark th:hover{color:var(--text)}
    table.benchmark td{padding:7px 10px;border-bottom:1px solid var(--border);font-family:var(--mono)}
    table.benchmark td.name{font-family:var(--sans)}
    table.benchmark tr:hover td{background:var(--bg-2)}
    table.benchmark tr.tti-row td{background:rgba(0,200,230,0.05)}
    .heat{padding:3px 6px;border-radius:3px}

    .view-toolbar{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
    .view-toolbar h2{margin:0;font-size:16px;font-weight:600}

    .matrix-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .matrix-card{background:var(--bg-1);border:1px solid var(--border);border-radius:6px;padding:14px}
    .matrix-card h3{margin:0 0 8px 0;font-size:13px}
    .matrix-card svg{width:100%;height:auto;display:block}

    /* COMPARISON BAR CHART */
    .compare-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
    .compare-table td,.compare-table th{padding:5px 6px;border-bottom:1px solid var(--border);text-align:left;font-family:var(--mono)}
    .compare-table th{color:var(--text-dim);font-size:9px;text-transform:uppercase;letter-spacing:0.5px}
    .compare-table td.label{color:var(--text-dim);font-family:var(--sans)}
    .bar-bg{background:var(--bg-3);border-radius:2px;height:6px;position:relative;margin-top:2px}
    .bar-fill{background:var(--accent);height:6px;border-radius:2px}

    ::-webkit-scrollbar{width:8px;height:8px}
    ::-webkit-scrollbar-track{background:var(--bg-1)}
    ::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:4px}
    ::-webkit-scrollbar-thumb:hover{background:var(--border)}
  </style>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <div class="logo">TTI</div>
        <div>
          <h1><strong>Cable & Infrastructure Benchmark</strong> &middot; <span class="meta">Subsea · Terrestrial · POP/NOC · Hyperscaler · AI DC · IXP</span></h1>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="meta" id="topbar-counts"></div>
      <div class="view-switch" id="view-switch">
        <button data-view="map" class="active">Map</button>
        <button data-view="table">Benchmark Table</button>
        <button data-view="matrix">Matrix</button>
      </div>
    </header>

    <main id="main">
      <aside id="sidebar-left">
        <div class="panel-section">
          <h3>Layers <button class="mini-btn" id="layer-all">all</button></h3>
          <div id="layer-toggles"></div>
        </div>

        <div class="panel-section filters">
          <h3>Filter Assets</h3>
          <input type="text" id="filter-search" placeholder="Search name, city, operator…" />
          <select id="filter-owner"><option value="">All operators</option></select>
          <select id="filter-type">
            <option value="">All types</option>
            <option value="subsea">Subsea cable</option>
            <option value="terrestrial">Terrestrial cable</option>
            <option value="pop">POP</option>
            <option value="noc">NOC</option>
            <option value="noc+pop">NOC + POP</option>
            <option value="landing">Landing station</option>
            <option value="landing+pop">Landing + POP</option>
            <option value="carrier-hotel">Carrier hotel</option>
            <option value="hyperscaler-region">Hyperscaler region</option>
            <option value="ai-megasite">AI mega DC</option>
            <option value="ixp">IXP</option>
          </select>
        </div>

        <div class="panel-section" style="border-bottom:none;padding-bottom:24px;">
          <h3>Assets <span id="asset-count" style="font-family:var(--mono);color:var(--text-mute);font-weight:400"></span></h3>
          <div class="asset-list" id="asset-list"></div>
        </div>
      </aside>

      <section id="content">
        <div id="map"></div>
        <div id="table-view"></div>
        <div id="matrix-view"></div>
        <div class="legend-overlay" id="legend"></div>
        <div class="stats-overlay" id="stats"></div>
      </section>

      <aside id="sidebar-right">
        <div id="asset-detail-pane">
          <div class="placeholder">Select an asset from the map<br/>or the sidebar to view details.</div>
        </div>
        <div class="comparison-pins">
          <div class="head">
            <h4>Comparison Pins (max 3)</h4>
            <div style="display:flex;gap:4px">
              <button class="action-btn" id="show-compare">Compare</button>
              <button class="action-btn" id="export-comparison">JSON</button>
            </div>
          </div>
          <div class="pin-slots" id="pin-slots">
            <div class="pin-slot" data-slot="0">empty</div>
            <div class="pin-slot" data-slot="1">empty</div>
            <div class="pin-slot" data-slot="2">empty</div>
          </div>
          <div id="compare-table-host"></div>
        </div>
      </aside>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
